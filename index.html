<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мудрец</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧙</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100dvh; width: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
        body { display: flex; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; }

        .sidebar { width: 280px; min-width: 280px; background: #2c2c2c; color: #e0e0e0; display: flex; flex-direction: column; border-right: 1px solid #3a3a3a; transition: margin-left 0.3s; z-index: 100; height: 100dvh; }
        .sidebar.collapsed { margin-left: -280px; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; left: 0; height: 100dvh; margin-left: -280px; }
            .sidebar.open { margin-left: 0; }
            .overlay.active { display: block; }
        }

        .sidebar-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3a3a3a; }
        .sage-dropdown { position: relative; flex: 1; margin-right: 12px; }
        .sage-current { background: #3a3a3a; border-radius: 8px; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 500; color: #fff; font-size: 14px; }
        .sage-list { position: absolute; top: 100%; left: 0; right: 0; background: #3a3a3a; border-radius: 0 0 8px 8px; display: none; z-index: 10; }
        .sage-list.show { display: block; }
        .sage-option { padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
        .sage-option:hover { background: #4a4a4a; }
        .collapse-btn { background: none; border: none; color: #e0e0e0; font-size: 20px; cursor: pointer; }
        .new-chat-btn { margin: 12px; padding: 10px; background: #3a3a3a; border-radius: 8px; text-align: center; cursor: pointer; }
        .new-chat-btn:hover { background: #4a4a4a; }
        .chat-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
        .chat-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
        .chat-item.active { background: #3a3a3a; }
        .chat-item:hover { background: #2a2a2a; }
        .chat-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: #fff; }
        .chat-delete { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; opacity: 0.6; }
        .chat-delete:hover { opacity: 1; color: #ff6666; }
        .sidebar-footer { padding: 12px; border-top: 1px solid #3a3a3a; font-size: 12px; opacity: 0.6; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: none; border: 1px solid #555; color: #ccc; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; display: none; }

        .main { flex: 1; display: flex; flex-direction: column; background: #000; height: 100dvh; overflow: hidden; }
        .top-bar { display: flex; align-items: center; padding: 8px 16px; gap: 12px; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
        .menu-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .top-bar-spacer { flex: 1; }
        .lang-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; position: relative; }
        .lang-dropdown { position: absolute; top: 100%; right: 0; background: #2c2c2c; border-radius: 8px; display: none; z-index: 20; min-width: 120px; }
        .lang-dropdown.show { display: block; }
        .lang-option { padding: 8px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; color: #fff; }
        .lang-option:hover { background: #3a3a3a; }

        .chat-area { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
        .message { margin-bottom: 14px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; } .message.sage { align-items: flex-start; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .user .bubble { background: #333; color: #fff; }
        .sage .bubble { background: #1a1a1a; color: #fff; }
        .sender-label { font-size: 12px; margin-bottom: 4px; opacity: 0.7; color: #ccc; }

        .input-area { display: flex; gap: 10px; padding: 12px 16px; background: #111; border-top: 1px solid #2a2a2a; flex-shrink: 0; }
        .input-area input { flex: 1; padding: 14px 18px; border-radius: 30px; border: none; background: #2a2a2a; color: #fff; font-size: 16px; outline: none; }
        .input-area input::placeholder { color: #aaa; }
        .input-area button { background: #333; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; color: #fff; cursor: pointer; }

        .loading-dots span { display: inline-block; width: 8px; height: 8px; margin: 0 2px; background: #fff; border-radius: 50%; animation: blink 1.4s infinite both; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; } .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }

        .auth-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; flex-direction: column; }
        .auth-box { background: #1e1e1e; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; color: #fff; }
        .auth-box h2 { margin-bottom: 16px; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; background: #333; border: none; border-radius: 8px; color: #fff; }
        .auth-box button { width: 100%; padding: 12px; background: #555; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; margin-top: 8px; }
        .auth-box a { color: #aaa; text-decoration: none; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sage-dropdown" id="sageDropdown">
                <div class="sage-current" id="currentSageBtn">
                    <span id="currentSageName">Мудрец Ислама</span>
                    <span>▼</span>
                </div>
                <div class="sage-list" id="sageList"></div>
            </div>
            <button class="collapse-btn" id="collapseSidebarBtn">☰</button>
        </div>
        <div class="new-chat-btn" id="newChatBtn">＋ Новый чат</div>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">
            <span id="sidebarFooter">Мудрец v1.0</span>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
    </div>

    <div class="main" id="main">
        <div class="top-bar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <span style="font-weight:500; color:#fff;">Мудрец</span>
            <div class="top-bar-spacer"></div>
            <div class="lang-btn" id="langBtn">
                🌐
                <div class="lang-dropdown" id="langDropdown">
                    <div class="lang-option" data-lang="ru">Русский</div>
                    <div class="lang-option" data-lang="en">English</div>
                    <div class="lang-option" data-lang="kk">Қазақша</div>
                </div>
            </div>
        </div>
        <div class="chat-area" id="chatContainer"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Задай вопрос мудрецу..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box" id="authBox"></div>
    </div>

    <script>
        // НАСТРОЙКИ: твой URL уже вставлен. Замени ключ!
        const SUPABASE_URL = 'https://gzbwvewcxvinwnrlcwem.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6Ynd2ZXdjeHZpbnducmxjd2VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjUyMDgsImV4cCI6MjA5NjI0MTIwOH0.4xPIXNkFc4KXAcaBiHCAGAdU6AQuR6VcK5Qg4yl8KFg'; // <- сюда вставь свой ключ

        const API_URL = 'https://mudretz.valekmastersaa.workers.dev/groq-proxy';
        const MODEL = 'llama-3.3-70b-versatile';
        const STORAGE_KEY_CHATS = 'mudrets_chats';

        // Проверка, вставлен ли реальный ключ (не заглушка)
        const USE_SUPABASE = SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'ВАШ_ANON_KEY';

        // Инициализация Supabase с защитой от ошибок
        let supabase = null;
        try {
            if (USE_SUPABASE) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase не инициализирован:', e);
        }

        // ... остальные константы (мудрецы, промпты, переводы) без изменений
        const sages = {
            islam: { name: 'Мудрец Ислама' },
            transurfing: { name: 'Мудрец Трансерфинга' },
            stoicism: { name: 'Мудрец Стоицизма' },
            buddhism: { name: 'Мудрец Буддизма' },
            orthodoxy: { name: 'Мудрец Православия' }
        };

        const sagePrompts = { /* те же, что и раньше */ };

        const translations = { /* те же */ };

        // Глобальное состояние
        let currentLang = localStorage.getItem('mudrets_lang') || 'ru';
        let currentSage = 'islam';
        let currentChatId = null;
        let chats = {};
        let user = null;

        // DOM элементы
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const main = document.getElementById('main');
        const currentSageBtn = document.getElementById('currentSageBtn');
        const currentSageNameSpan = document.getElementById('currentSageName');
        const sageList = document.getElementById('sageList');
        const chatListDiv = document.getElementById('chatList');
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const logoutBtn = document.getElementById('logoutBtn');

        // ==================== АВТОРИЗАЦИЯ ====================
        async function checkAuth() {
            if (!USE_SUPABASE || !supabase) {
                user = null;
                updateAuthUI();
                chats = loadLocalChats();
                renderAll();
                return;
            }

            try {
                const { data: { session } } = await supabase.auth.getSession();
                user = session?.user || null;
                updateAuthUI();
                if (user) {
                    await loadChatsFromDB();
                    hideAuthForm();
                } else {
                    chats = {};
                    showAuthForm();
                }
                renderAll();
            } catch (e) {
                console.error('Ошибка авторизации:', e);
                // В случае ошибки откатываемся к локальному режиму
                user = null;
                updateAuthUI();
                chats = loadLocalChats();
                hideAuthForm();
                renderAll();
            }
        }

        function updateAuthUI() {
            logoutBtn.style.display = (user && USE_SUPABASE) ? 'inline-block' : 'none';
        }

        function showAuthForm() {
            if (!USE_SUPABASE) return;
            document.getElementById('authOverlay').style.display = 'flex';
            renderAuthBox('login');
        }
        function hideAuthForm() {
            document.getElementById('authOverlay').style.display = 'none';
        }

        function renderAuthBox(mode) {
            // ... (код формы входа/регистрации без изменений) ...
        }

        logoutBtn.addEventListener('click', async () => {
            if (!supabase) return;
            await supabase.auth.signOut();
            user = null;
            updateAuthUI();
            chats = {};
            clearAll();
            showAuthForm();
        });

        // ==================== ЧАТЫ (локальные и облачные) ====================
        function loadLocalChats() {
            const stored = localStorage.getItem(STORAGE_KEY_CHATS);
            return stored ? JSON.parse(stored) : {};
        }
        function saveLocalChats() {
            localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chats));
        }

        async function loadChatsFromDB() {
            if (!supabase || !user) return;
            const { data, error } = await supabase.from('chats').select('*').eq('user_id', user.id);
            if (error) { console.error(error); return; }
            const grouped = {};
            data.forEach(row => {
                const key = row.sage_key;
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push({ id: row.id, title: row.title, messages: row.messages || [] });
            });
            chats = grouped;
        }

        async function saveChatsToDB() {
            if (!supabase || !user) return;
            await supabase.from('chats').delete().eq('user_id', user.id);
            const rows = [];
            for (const sageKey in chats) {
                for (const chat of chats[sageKey]) {
                    rows.push({ id: chat.id, user_id: user.id, sage_key: sageKey, title: chat.title, messages: chat.messages });
                }
            }
            if (rows.length > 0) await supabase.from('chats').insert(rows);
        }

        function persistChats() {
            if (USE_SUPABASE && user && supabase) {
                saveChatsToDB();
            } else {
                saveLocalChats();
            }
        }

        function clearAll() {
            chatContainer.innerHTML = '';
            chatListDiv.innerHTML = '';
            currentChatId = null;
        }

        // ... (функции renderAll, createNewChat, loadChat, deleteChat, sendMessage и т.д. – они идентичны предыдущим версиям, но везде используется persistChats() вместо прямых save...) ...

        // Инициализация
        if (isMobile()) {
            sidebar.classList.add('collapsed');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        // Запуск с проверкой авторизации
        checkAuth();
    </script>
</body>
</html>
