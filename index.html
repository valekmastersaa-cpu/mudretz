<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мудрец</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3c72">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧙</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; height: 100vh; display: flex; overflow: hidden; background: #000; }

        /* Оверлей для мобильных */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 50;
        }

        /* Боковая панель */
        .sidebar {
            width: 280px; min-width: 280px;
            background: #2c2c2c; color: #e0e0e0;
            display: flex; flex-direction: column;
            border-right: 1px solid #3a3a3a;
            transition: margin-left 0.3s;
            z-index: 100;
        }
        .sidebar.collapsed { margin-left: -280px; }

        /* Мобильная версия сайдбара */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0; left: 0; height: 100%;
                margin-left: -280px;
            }
            .sidebar.open {
                margin-left: 0;
            }
            .sidebar.collapsed {
                margin-left: -280px;
            }
            .overlay.active {
                display: block;
            }
        }

        .sidebar-header {
            padding: 16px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #3a3a3a;
        }
        .sage-dropdown { position: relative; flex: 1; margin-right: 12px; }
        .sage-current {
            background: #3a3a3a; border-radius: 8px; padding: 8px 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            font-weight: 500; color: #fff; font-size: 14px;
        }
        .sage-list {
            position: absolute; top: 100%; left: 0; right: 0; background: #3a3a3a;
            border-radius: 0 0 8px 8px; display: none; z-index: 10;
        }
        .sage-list.show { display: block; }
        .sage-option {
            padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;
            font-size: 13px; white-space: nowrap;
        }
        .sage-option:hover { background: #4a4a4a; }
        .collapse-btn { background: none; border: none; color: #e0e0e0; font-size: 20px; cursor: pointer; }
        .new-chat-btn { margin: 12px; padding: 10px; background: #3a3a3a; border-radius: 8px; text-align: center; cursor: pointer; }
        .new-chat-btn:hover { background: #4a4a4a; }
        .chat-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
        .chat-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
        .chat-item.active { background: #3a3a3a; }
        .chat-item:hover { background: #2a2a2a; }
        .chat-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: #fff; }
        .chat-delete { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; opacity: 0.6; }
        .chat-delete:hover { opacity: 1; color: #ff6666; }
        .sidebar-footer { padding: 12px; border-top: 1px solid #3a3a3a; font-size: 12px; opacity: 0.6; }

        /* Основная область */
        .main {
            flex: 1; display: flex; flex-direction: column;
            background: #000; transition: background 0.3s;
        }
        .top-bar {
            display: flex; align-items: center; padding: 8px 16px; gap: 12px;
            border-bottom: 1px solid #2a2a2a;
        }
        .menu-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .top-bar-spacer { flex: 1; }
        .lang-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; position: relative; }
        .lang-dropdown {
            position: absolute; top: 100%; right: 0; background: #2c2c2c; border-radius: 8px;
            display: none; z-index: 20; min-width: 120px;
        }
        .lang-dropdown.show { display: block; }
        .lang-option {
            padding: 8px 12px; cursor: pointer; font-size: 14px; white-space: nowrap;
            color: #fff;
        }
        .lang-option:hover { background: #3a3a3a; }
        .chat-area {
            flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 16px;
        }
        .message { margin-bottom: 14px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; } .message.sage { align-items: flex-start; }
        .bubble {
            max-width: 85%; padding: 12px 16px; border-radius: 18px;
            font-size: 16px; line-height: 1.4; word-wrap: break-word;
        }
        .user .bubble {
            background: #333; color: #fff;
        }
        .sage .bubble {
            background: #1a1a1a; color: #fff;
        }
        .sender-label { font-size: 12px; margin-bottom: 4px; opacity: 0.7; color: #ccc; }
        .input-area {
            display: flex; gap: 10px; padding: 12px 16px;
            background: #111; border-top: 1px solid #2a2a2a;
        }
        .input-area input {
            flex: 1; padding: 14px 18px; border-radius: 30px; border: none;
            background: #2a2a2a; color: #fff; font-size: 16px; outline: none;
        }
        .input-area input::placeholder { color: #aaa; }
        .input-area button {
            background: #333; border: none; border-radius: 50%;
            width: 50px; height: 50px; font-size: 24px; color: #fff; cursor: pointer;
        }
        .loading-dots span {
            display: inline-block; width: 8px; height: 8px; margin: 0 2px;
            background: #fff; border-radius: 50%; animation: blink 1.4s infinite both;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sage-dropdown" id="sageDropdown">
                <div class="sage-current" id="currentSageBtn">
                    <span id="currentSageName">Мудрец Ислама</span>
                    <span>▼</span>
                </div>
                <div class="sage-list" id="sageList"></div>
            </div>
            <button class="collapse-btn" id="collapseSidebarBtn">☰</button>
        </div>
        <div class="new-chat-btn" id="newChatBtn">＋ Новый чат</div>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer" id="sidebarFooter">Мудрец v1.0</div>
    </div>

    <div class="main" id="main">
        <div class="top-bar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <span style="font-weight:500; color:#fff;">Мудрец</span>
            <div class="top-bar-spacer"></div>
            <div class="lang-btn" id="langBtn">
                🌐
                <div class="lang-dropdown" id="langDropdown">
                    <div class="lang-option" data-lang="ru">Русский</div>
                    <div class="lang-option" data-lang="en">English</div>
                    <div class="lang-option" data-lang="kk">Қазақша</div>
                </div>
            </div>
        </div>
        <div class="chat-area" id="chatContainer"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Задай вопрос мудрецу..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const translations = {
            ru: {
                sageNames: {
                    islam: 'Мудрец Ислама',
                    transurfing: 'Мудрец Трансерфинга',
                    stoicism: 'Мудрец Стоицизма',
                    buddhism: 'Мудрец Буддизма',
                    orthodoxy: 'Мудрец Православия'
                },
                newChat: '＋ Новый чат',
                footer: 'Мудрец v1.0',
                inputPlaceholder: 'Задай вопрос мудрецу...',
                sendBtn: '➤',
                systemUnavailable: '⚠️ Мудрец временно недоступен. Проверьте ключ или интернет.',
                you: 'Вы',
                newChatDefault: 'Новый чат',
                topBarTitle: 'Мудрец',
                systemSelectSage: 'Вы говорите с '
            },
            en: {
                sageNames: {
                    islam: 'Sage of Islam',
                    transurfing: 'Sage of Transurfing',
                    stoicism: 'Sage of Stoicism',
                    buddhism: 'Sage of Buddhism',
                    orthodoxy: 'Sage of Orthodoxy'
                },
                newChat: '＋ New Chat',
                footer: 'Sage v1.0',
                inputPlaceholder: 'Ask the sage...',
                sendBtn: '➤',
                systemUnavailable: '⚠️ The sage is temporarily unavailable. Check your key or internet.',
                you: 'You',
                newChatDefault: 'New Chat',
                topBarTitle: 'Sage',
                systemSelectSage: 'You are speaking with '
            },
            kk: {
                sageNames: {
                    islam: 'Ислам данышпаны',
                    transurfing: 'Трансерфинг данышпаны',
                    stoicism: 'Стоицизм данышпаны',
                    buddhism: 'Буддизм данышпаны',
                    orthodoxy: 'Православие данышпаны'
                },
                newChat: '＋ Жаңа чат',
                footer: 'Данышпан v1.0',
                inputPlaceholder: 'Данышпанға сұрақ қойыңыз...',
                sendBtn: '➤',
                systemUnavailable: '⚠️ Данышпан уақытша қолжетімсіз. Кілтті немесе интернетті тексеріңіз.',
                you: 'Сіз',
                newChatDefault: 'Жаңа чат',
                topBarTitle: 'Данышпан',
                systemSelectSage: 'Сіз сөйлесіп тұрған: '
            }
        };

        const API_URL = 'https://mudretz.valekmastersaa.workers.dev/groq-proxy';
        const MODEL = 'llama-3.3-70b-versatile';
        const STORAGE_KEY_CHATS = 'mudrets_chats';

        // Мудрецы теперь хранят только имена, цвета не используются
        const sages = {
            islam: { name: 'Мудрец Ислама' },
            transurfing: { name: 'Мудрец Трансерфинга' },
            stoicism: { name: 'Мудрец Стоицизма' },
            buddhism: { name: 'Мудрец Буддизма' },
            orthodoxy: { name: 'Мудрец Православия' }
        };

        const sagePrompts = {
            islam: `Ты — Мудрец Ислама, знаток Корана и сунны...`,
            transurfing: `Ты — Мудрец Трансерфинга...`,
            stoicism: `Ты — Мудрец Стоицизма...`,
            buddhism: `Ты — Мудрец Буддизма...`,
            orthodoxy: `Ты — Мудрец Православия...`
        };

        let currentLang = localStorage.getItem('mudrets_lang') || 'ru';
        let currentSage = 'islam';
        let currentChatId = null;
        let chats = {};

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const main = document.getElementById('main');
        const currentSageBtn = document.getElementById('currentSageBtn');
        const currentSageNameSpan = document.getElementById('currentSageName');
        const sageList = document.getElementById('sageList');
        const chatListDiv = document.getElementById('chatList');
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');

        // Проверка мобильного устройства
        function isMobile() {
            return window.innerWidth <= 768;
        }

        // Закрытие боковой панели на мобильных
        function closeSidebarMobile() {
            if (isMobile()) {
                sidebar.classList.remove('open');
                sidebar.classList.add('collapsed');
                overlay.classList.remove('active');
            }
        }

        // Открытие боковой панели
        function openSidebar() {
            if (isMobile()) {
                sidebar.classList.add('open');
                sidebar.classList.remove('collapsed');
                overlay.classList.add('active');
            } else {
                sidebar.classList.remove('collapsed');
            }
        }

        // Переключение боковой панели по кнопке
        function toggleSidebar() {
            if (isMobile()) {
                if (sidebar.classList.contains('open')) {
                    closeSidebarMobile();
                } else {
                    openSidebar();
                }
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        // Обработчик клика по основной области для закрытия сайдбара на мобильных
        main.addEventListener('click', (e) => {
            if (isMobile() && sidebar.classList.contains('open')) {
                // Не закрывать, если клик был по кнопке меню или внутри сайдбара
                if (!e.target.closest('.sidebar') && !e.target.closest('#menuBtn')) {
                    closeSidebarMobile();
                }
            }
        });

        overlay.addEventListener('click', () => {
            closeSidebarMobile();
        });

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('mudrets_lang', lang);
            const t = translations[lang];
            for (const key in sages) {
                sages[key].name = t.sageNames[key];
            }
            currentSageNameSpan.textContent = sages[currentSage].name;
            newChatBtn.textContent = t.newChat;
            document.getElementById('sidebarFooter').textContent = t.footer;
            userInput.placeholder = t.inputPlaceholder;
            sendBtn.textContent = t.sendBtn;
            document.querySelector('.top-bar span').textContent = t.topBarTitle;
            renderSageList();
            renderChatList();
            const youLabels = document.querySelectorAll('.message.user .sender-label');
            youLabels.forEach(label => { label.textContent = t.you; });
        }

        function loadChatsFromStorage() {
            const stored = localStorage.getItem(STORAGE_KEY_CHATS);
            return stored ? JSON.parse(stored) : {};
        }
        function saveChatsToStorage() {
            localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chats));
        }
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function renderSageList() {
            sageList.innerHTML = '';
            Object.entries(sages).forEach(([key, sage]) => {
                const div = document.createElement('div');
                div.className = 'sage-option';
                div.textContent = sage.name;
                div.addEventListener('click', () => {
                    selectSage(key);
                    sageList.classList.remove('show');
                    closeSidebarMobile(); // Закрываем сайдбар после выбора
                });
                sageList.appendChild(div);
            });
        }

        function renderChatList() {
            chatListDiv.innerHTML = '';
            const sageChats = chats[currentSage] || [];
            const t = translations[currentLang];
            sageChats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.innerHTML = `
                    <span class="chat-title">${chat.title || t.newChatDefault}</span>
                    <button class="chat-delete" data-chatid="${chat.id}">🗑</button>
                `;
                item.querySelector('.chat-title').addEventListener('click', () => {
                    loadChat(chat.id);
                    closeSidebarMobile();
                });
                item.querySelector('.chat-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                });
                chatListDiv.appendChild(item);
            });
        }

        function selectSage(key) {
            currentSage = key;
            currentSageNameSpan.textContent = sages[key].name;
            const sageChats = chats[currentSage] || [];
            if (sageChats.length > 0) {
                loadChat(sageChats[0].id);
            } else {
                createNewChat();
            }
            renderChatList();
        }

        function createNewChat() {
            if (!chats[currentSage]) chats[currentSage] = [];
            const newChat = {
                id: generateId(),
                title: 'Новый чат',
                messages: []
            };
            chats[currentSage].unshift(newChat);
            saveChatsToStorage();
            loadChat(newChat.id);
            renderChatList();
            closeSidebarMobile();
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            const chat = findChat(chatId);
            if (!chat) return;
            chatContainer.innerHTML = '';
            chat.messages.forEach(msg => {
                appendMessageToContainer(msg.text, msg.sender, msg.sageName);
            });
            renderChatList();
        }

        function findChat(chatId) {
            for (const sageKey in chats) {
                const chat = chats[sageKey].find(c => c.id === chatId);
                if (chat) return chat;
            }
            return null;
        }

        function deleteChat(chatId) {
            for (const sageKey in chats) {
                const index = chats[sageKey].findIndex(c => c.id === chatId);
                if (index !== -1) {
                    chats[sageKey].splice(index, 1);
                    saveChatsToStorage();
                    if (chatId === currentChatId) {
                        const remaining = chats[currentSage] || [];
                        if (remaining.length > 0) {
                            loadChat(remaining[0].id);
                        } else {
                            createNewChat();
                        }
                    }
                    renderChatList();
                    break;
                }
            }
        }

        function appendMessageToContainer(text, sender, sageName = '') {
            const t = translations[currentLang];
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user' : 'sage');
            const label = document.createElement('div');
            label.classList.add('sender-label');
            label.textContent = sender === 'user' ? t.you : (sageName || 'Мудрец');
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.textContent = text;
            msgDiv.appendChild(label);
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addMessageToCurrentChat(text, sender, sageName) {
            const chat = findChat(currentChatId);
            if (chat) {
                chat.messages.push({ text, sender, sageName });
                if (sender === 'user' && chat.title === 'Новый чат') {
                    chat.title = text.length > 30 ? text.substring(0, 30) + '...' : text;
                }
                saveChatsToStorage();
                renderChatList();
            }
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.classList.add('message', 'sage');
            loader.id = 'loader';
            const label = document.createElement('div');
            label.classList.add('sender-label');
            label.textContent = sages[currentSage]?.name || 'Мудрец';
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
            loader.appendChild(label);
            loader.appendChild(bubble);
            chatContainer.appendChild(loader);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function removeLoading() {
            const l = document.getElementById('loader');
            if (l) l.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessageToContainer(text, 'user');
            addMessageToCurrentChat(text, 'user', translations[currentLang].you);
            userInput.value = '';
            showLoading();

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { role: 'system', content: sagePrompts[currentSage] },
                            ...findChat(currentChatId).messages.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
                        ],
                        temperature: 0.8,
                        max_tokens: 350
                    })
                });
                const data = await resp.json();
                removeLoading();
                if (!resp.ok) throw new Error(data.error?.message || 'Ошибка');
                const reply = data.choices[0].message.content;
                appendMessageToContainer(reply, 'sage', sages[currentSage].name);
                addMessageToCurrentChat(reply, 'sage', sages[currentSage].name);
            } catch (e) {
                removeLoading();
                console.error(e);
                appendMessageToContainer(translations[currentLang].systemUnavailable, 'sage', 'Система');
            }
        }

        // Обработчики событий
        currentSageBtn.addEventListener('click', () => { sageList.classList.toggle('show'); });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.sage-dropdown')) sageList.classList.remove('show');
        });

        document.getElementById('collapseSidebarBtn').addEventListener('click', toggleSidebar);
        document.getElementById('menuBtn').addEventListener('click', toggleSidebar);

        newChatBtn.addEventListener('click', createNewChat);
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.lang-btn')) langDropdown.classList.remove('show');
        });
        langDropdown.querySelectorAll('.lang-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                const lang = e.target.getAttribute('data-lang');
                applyLanguage(lang);
                langDropdown.classList.remove('show');
            });
        });

        // Инициализация
        chats = loadChatsFromStorage();
        applyLanguage(currentLang);
        renderSageList();
        selectSage('islam');

        // На десктопе по умолчанию боковая панель видна, на мобильных скрыта
        if (isMobile()) {
            sidebar.classList.add('collapsed');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        } else {
            sidebar.classList.remove('collapsed');
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('service-worker.js').catch(function(){});
            });
        }
    </script>
</body>
</html>
